apiVersion: v1
kind: Secret
metadata:
  name: {{ include "n8n.secretName" . }}
  labels:
    {{- include "library-chart.labels" . | nindent 4 }}
  {{- if .Values.persistence.keepOnUninstall }}
  annotations:
    # La clé de chiffrement doit survivre au volume qu'elle protège.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  N8N_ENCRYPTION_KEY: {{ include "n8n.encryptionKey" . | b64enc | quote }}
  OWNER_EMAIL: {{ .Values.security.email | b64enc | quote }}
  OWNER_PASSWORD: {{ include "n8n.ownerPassword" . | b64enc | quote }}
  {{- if .Values.mcp.enabled }}
  MCP_AUTH_TOKEN: {{ include "n8n.mcpToken" . | b64enc | quote }}
  {{- end }}
  {{- if eq (include "n8n.postgresMode" .) "external" }}
  DB_POSTGRESDB_PASSWORD: {{ .Values.database.postgres.password | b64enc | quote }}
  {{- end }}
