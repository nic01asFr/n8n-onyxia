{{- if .Values.runners.enabled }}
{{- /*
  Remplace /etc/n8n-task-runners.json de l'image n8nio/runners, repris de
  docker/images/runners/n8n-task-runners.json (n8n 2.38.6). Seules les listes
  de modules autorisés viennent des valeurs : l'image les force à vide, et le
  lanceur ne transmet pas ces variables aux runners. À comparer avec le fichier
  officiel à chaque montée de version de n8n.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "library-chart.fullname" . }}-runners
  labels:
    {{- include "library-chart.labels" . | nindent 4 }}
data:
  n8n-task-runners.json: |
    {
      "task-runners": [
        {
          "runner-type": "javascript",
          "workdir": "/home/runner",
          "command": "/usr/local/bin/node",
          "args": [
            "--disallow-code-generation-from-strings",
            "--disable-proto=delete",
            "/opt/runners/task-runner-javascript/dist/start.js"
          ],
          "health-check-server-port": "5681",
          "allowed-env": [
            "PATH",
            "GENERIC_TIMEZONE",
            "NODE_OPTIONS",
            "NODE_PATH",
            "N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT",
            "N8N_RUNNERS_TASK_TIMEOUT",
            "N8N_RUNNERS_MAX_CONCURRENCY",
            "N8N_SENTRY_DSN",
            "N8N_VERSION",
            "ENVIRONMENT",
            "DEPLOYMENT_NAME",
            "HOME"
          ],
          "env-overrides": {
            "NODE_FUNCTION_ALLOW_BUILTIN": {{ .Values.runners.javascript.builtinAllow | toJson }},
            "NODE_FUNCTION_ALLOW_EXTERNAL": {{ .Values.runners.javascript.externalAllow | toJson }},
            "N8N_RUNNERS_HEALTH_CHECK_SERVER_HOST": "0.0.0.0"
          }
        },
        {
          "runner-type": "python",
          "workdir": "/home/runner",
          "command": "/opt/runners/task-runner-python/.venv/bin/python",
          "args": ["-I", "-B", "-X", "disable_remote_debug", "-m", "src.main"],
          "health-check-server-port": "5682",
          "allowed-env": [
            "PATH",
            "N8N_RUNNERS_LAUNCHER_LOG_LEVEL",
            "N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT",
            "N8N_RUNNERS_TASK_TIMEOUT",
            "N8N_RUNNERS_MAX_CONCURRENCY",
            "N8N_SENTRY_DSN",
            "N8N_VERSION",
            "ENVIRONMENT",
            "DEPLOYMENT_NAME"
          ],
          "env-overrides": {
            "N8N_RUNNERS_STDLIB_ALLOW": {{ .Values.runners.python.stdlibAllow | toJson }},
            "N8N_RUNNERS_EXTERNAL_ALLOW": {{ .Values.runners.python.externalAllow | toJson }}
          }
        }
      ]
    }
{{- end }}
