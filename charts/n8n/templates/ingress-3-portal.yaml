{{- /*
  Hôte du portail d'actions : la seule entrée publique vers les workflows.
  L'allowlist IP de l'éditeur ne s'applique pas ici : les destinataires ouvrent
  le portail depuis leur propre navigateur, et c'est le jeton Grist qui décide.
*/}}
{{- if and .Values.portal.enabled .Values.ingress.enabled (not .Values.global.suspend) }}
{{- $fullName := include "library-chart.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-portal
  labels:
    {{- include "library-chart.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ add .Values.portal.runTimeoutSeconds 30 | quote }}
    {{- if .Values.ingress.useCertManager }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.certManagerClusterIssuer | quote }}
    acme.cert-manager.io/http01-ingress-class: {{ .Values.ingress.ingressClassName | quote }}
    {{- end }}
spec:
  {{- with .Values.ingress.ingressClassName }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.portal.hostname | quote }}
      {{- if .Values.ingress.useCertManager }}
      secretName: tls-cert-{{ $fullName }}-portal
      {{- end }}
  {{- end }}
  rules:
    - host: {{ required "portal.hostname est obligatoire quand portal.enabled et ingress.enabled." .Values.portal.hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ .Values.networking.portal.port }}
{{- end }}
