# Valeurs par défaut du chart n8n pour Onyxia.
#
# Lancé depuis un catalogue Onyxia, le formulaire (values.schema.json) renseigne
# l'hôte, l'email et le mot de passe. En ligne de commande, scripts/install.sh
# injecte les mêmes valeurs à partir de l'environnement du pod Jupyter.

# --- Image n8n -----------------------------------------------------------------
service:
  image:
    repository: docker.n8n.io/n8nio/n8n
    # Tag figé : un « latest » ferait dépendre la version du jour du redémarrage.
    tag: "2.38.6"
    pullPolicy: IfNotPresent

# --- Accès -----------------------------------------------------------------------
security:
  # Identifiant du compte owner n8n. Onyxia : {{user.email}}.
  email: ""
  # Mot de passe du compte owner. Onyxia : {{service.oneTimePassword}}, affiché
  # dans « Mes services ». n8n exige une majuscule et un chiffre : s'il en manque,
  # le chart préfixe la valeur par « N8n- » et affiche le mot de passe effectif.
  # Vide : tiré au sort et conservé dans le Secret de la release.
  password: ""
  # Restreint l'accès aux IP listées (annotation nginx whitelist-source-range).
  allowlist:
    enabled: false
    ip: "0.0.0.0/0"
  # N'accepte que le trafic du namespace et du contrôleur d'ingress.
  networkPolicy:
    enabled: false
    from: []

# Identité affichée dans n8n pour le compte owner.
owner:
  firstName: "Admin"
  lastName: "n8n"

# --- n8n -------------------------------------------------------------------------
n8n:
  timezone: Europe/Paris
  logLevel: info
  # Chiffre les credentials stockées par n8n. Vide : tirée au sort au premier
  # déploiement puis relue dans le Secret aux mises à jour. La perdre rend les
  # credentials existantes illisibles.
  encryptionKey: ""
  # Catalogue de modèles de workflows publié par n8n.io.
  templates: true
  # Télémétrie et bannières n8n.
  diagnostics: false
  # Paquets communautaires non vérifiés par n8n : du code tiers exécuté dans le
  # pod. Désactivés par défaut sur une plateforme partagée.
  unverifiedCommunityPackages: false
  # Dossier dans lequel n8n crée « .n8n ». Le volume est monté sur
  # /home/node/.n8n : les données sont donc à la racine du volume. Les charts
  # 0.x posaient /home/node/.n8n, d'où des données dans « .n8n/.n8n » : pour
  # reprendre un tel volume, régler cette valeur sur /home/node/.n8n.
  userFolder: /home/node
  # Variables d'environnement supplémentaires, par nom.
  extraEnv: {}

# --- Provisioning dans le pod ------------------------------------------------------
# Un conteneur annexe crée le compte owner dès le démarrage, puis une clé API pour
# le serveur MCP, déposée sur le volume. Tout passe par localhost : aucun droit
# Kubernetes n'est nécessaire. Sans lui, l'écran de création du compte owner
# resterait ouvert au premier visiteur de l'URL publique.
provisioning:
  enabled: true
  apiKeyLabel: onyxia-mcp
  # Préfixes des scopes accordés à la clé API du MCP. Vide : tous les scopes.
  apiKeyScopePrefixes: "workflow:,execution:,tag:,dataTable:,credential:,folder:"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# --- Serveur MCP -------------------------------------------------------------------
# czlonkowski/n8n-mcp, dans le même pod : il joint n8n sur localhost avec la clé
# provisionnée, et s'expose sur son propre hôte.
mcp:
  enabled: true
  image:
    repository: ghcr.io/czlonkowski/n8n-mcp
    tag: "2.84.0"
    pullPolicy: IfNotPresent
  # Hôte public du serveur MCP. Onyxia le renseigne.
  hostname: ""
  # Jeton Bearer exigé par /mcp. Vide : dérivé du mot de passe owner, donc
  # stable et affichable dans les notes sans être stocké ailleurs.
  token: ""
  logLevel: info
  # Protection SSRF des outils MCP. « moderate » autorise localhost (n8n dans
  # le pod) et refuse les IP privées du cluster.
  securityMode: moderate
  corsOrigin: "*"
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# --- Portail d'actions -------------------------------------------------------------
# Transforme des workflows choisis en actions guidées, lancées depuis un widget
# Grist par les personnes ayant accès au document. Seule porte publique vers
# les workflows : il vérifie le jeton Grist du lecteur et appelle les webhooks
# en localhost. Code : files/portal/.
portal:
  enabled: false
  # Hôte public du portail. Onyxia le renseigne.
  hostname: ""
  # Le mode « Configurer » s'ouvre avec le jeton du serveur MCP, le compte n8n
  # du service ou une clé API, par le compte Grist propriétaire : aucun jeton à
  # régler ici. Le secret
  # joint aux webhooks est tiré au sort et gardé dans le Secret.
  # Hôtes Grist dont le portail accepte les documents, et qui peuvent
  # l'intégrer en iframe.
  gristOrigins: "https://grist.numerique.gouv.fr,https://docs.getgrist.com"
  # API des widgets Grist, chargée par la page du portail. Celle de
  # docs.getgrist.com est une version de développement pleine d'eval(), que la
  # politique de sécurité du portail bloque : window.grist n'était jamais défini.
  gristPluginUrl: "https://grist.numerique.gouv.fr/grist-plugin-api.js"
  # Durée maximale d'une exécution avant abandon.
  runTimeoutSeconds: 120
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      cpu: 300m
      memory: 128Mi

# --- Base de données -----------------------------------------------------------------
database:
  # sqlite : sur le volume, suffisant pour un usage personnel ou d'équipe.
  # postgresdb : PostgreSQL externe (voir aussi discovery.postgresql).
  type: sqlite
  postgres:
    host: ""
    port: 5432
    database: n8n
    user: n8n
    password: ""
    schema: public
    ssl: false

# Utilise le premier service PostgreSQL Onyxia du namespace (annotation
# onyxia/discovery: postgres) quand database.type vaut sqlite.
discovery:
  postgresql: false

# --- Persistance -----------------------------------------------------------------------
# /home/node/.n8n : base SQLite, credentials chiffrées, fichiers binaires.
persistence:
  enabled: true
  size: 5Gi
  # Vide : classe par défaut du cluster. « - » : aucune classe.
  storageClass: ""
  accessMode: ReadWriteOnce
  # Réutiliser un volume existant (par exemple celui d'un service supprimé).
  existingClaim: ""
  # Conserver volume et Secret après suppression de la release. Utile en ligne
  # de commande, où le nom de release est stable ; dans Onyxia, chaque
  # lancement porte un nom neuf et le volume resterait orphelin.
  keepOnUninstall: false

# --- Réseau ------------------------------------------------------------------------------
networking:
  type: ClusterIP
  service:
    port: 5678
  mcp:
    port: 3000
  portal:
    port: 3100

ingress:
  enabled: true
  tls: true
  ingressClassName: ""
  hostname: ""
  useCertManager: false
  certManagerClusterIssuer: ""
  # Temporisations longues : éditeur temps réel, exécutions et flux MCP.
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

route:
  enabled: false
  hostname: ""
  annotations: {}
  tls:
    termination: edge
  wildcardPolicy: None

# --- Ressources du conteneur n8n ------------------------------------------------------------
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

# --- Onyxia ------------------------------------------------------------------------------------
userPreferences:
  # Langue des notes affichées dans « Mes services » : fr ou en.
  language: fr

global:
  # Mise en veille depuis Onyxia : le pod est arrêté, le volume conservé.
  suspend: false

# --- Pod -----------------------------------------------------------------------------------------
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Commun aux trois conteneurs. L'image MCP déclare un utilisateur non numérique
# (« nodejs ») que kubelet ne sait pas vérifier sous runAsNonRoot : elle tourne
# donc elle aussi en uid 1000, sa base de nœuds étant déplacée sur un volume
# temporaire inscriptible (éprouvé sur n8n-mcp 2.84.0).
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
nameOverride: ""
fullnameOverride: ""
