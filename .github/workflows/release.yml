name: Test and release

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - 'scripts/**'
      - 'site/**'
      - 'tests/**'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'charts/**'
      - 'scripts/**'
      - 'site/**'
      - 'tests/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.21.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Helm 3 joint le cluster même en --dry-run=client : un kind éphémère
      # permet de rendre les notes comme lors d'une vraie installation.
      - uses: helm/kind-action@v1

      - name: Dependencies
        run: helm dependency update charts/n8n

      - name: Lint
        run: helm lint charts/n8n --set ingress.hostname=n8n.example.org --set mcp.hostname=mcp.example.org

      # helm lint ne voit pas les branches conditionnelles : chaque cas est rendu.
      - name: Render every configuration
        run: |
          set -euo pipefail
          HOSTS="--set ingress.hostname=n8n.example.org --set mcp.hostname=mcp.example.org --set security.email=a@example.org"
          render() { echo "::group::$1"; shift; helm template t charts/n8n $HOSTS "$@" > /tmp/out.yaml; echo "::endgroup::"; }

          # Mot de passe Onyxia (base 36 minuscule) : préfixé pour n8n, et
          # affiché dans les notes au format que lit le bouton de copie.
          helm install t charts/n8n $HOSTS --set security.password=abcdefghij0123456789 --dry-run=client > /tmp/notes.txt
          grep -q 'password: N8n-abcdefghij0123456789' /tmp/notes.txt
          # Bouton « Ouvrir » : même extraction qu'Onyxia (première URL d'Ingress
          # citée, suivie de tout sauf espace et « ) »). Doit donner l'éditeur.
          node -e '
            const raw = require("fs").readFileSync("/tmp/notes.txt", "utf8");
            const notes = raw.slice(raw.indexOf("NOTES:"));
            const hosts = ["https://n8n.example.org", "https://mcp.example.org"];
            const re = new RegExp(hosts.map(h => h.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?:[/?#][^\\s)]*)?").join("|"), "i");
            const m = re.exec(notes);
            if (!m || m[0] !== "https://n8n.example.org/") { console.error("URL du bouton Ouvrir :", m && m[0]); process.exit(1); }
          '

          render "mot de passe tiré au sort"
          render "postgres externe" --set database.type=postgresdb --set database.postgres.host=pg --set database.postgres.password=x
          render "sans MCP" --set mcp.enabled=false
          render "mise en veille" --set global.suspend=true
          grep -q 'replicas: 0' /tmp/out.yaml
          ! grep -q 'kind: Ingress' /tmp/out.yaml

          # Un Ingress sans hôte capterait tout le trafic non attribué : refusé.
          if helm template t charts/n8n > /dev/null 2>&1; then
            echo "le rendu sans hôte aurait dû échouer"; exit 1
          fi

      - name: install.sh
        run: bash -n scripts/install.sh

      - name: Vitrine
        run: node --test site/generate.test.mjs

      - name: Portail
        run: node --test tests/portal/*.test.mjs

      # Portail activé : code embarqué dans la ConfigMap, secret des webhooks dans le Secret,
      # conteneur, et refus d'un rendu sans hôte public.
      - name: Render with the portal
        run: |
          set -euo pipefail
          HOSTS="--set ingress.hostname=n8n.example.org --set mcp.hostname=mcp.example.org --set security.email=a@example.org"
          helm template t charts/n8n $HOSTS --set portal.enabled=true --set portal.hostname=portail.example.org > /tmp/portal.yaml
          grep -q 'server.mjs:' /tmp/portal.yaml
          grep -q 'PORTAL_WEBHOOK_SECRET' /tmp/portal.yaml
          grep -q 'command: \["node", "/portal/start.mjs"\]' /tmp/portal.yaml
          grep -q 'start.mjs:' /tmp/portal.yaml
          grep -q 'host: "portail.example.org"' /tmp/portal.yaml
          if helm template t charts/n8n $HOSTS --set portal.enabled=true > /dev/null 2>&1; then
            echo "le rendu du portail sans hôte aurait dû échouer"; exit 1
          fi

      # Nœuds Code : runners à la version exacte de n8n, broker sur localhost,
      # configuration du lanceur en JSON valide ; rien quand ils sont désactivés.
      - name: Render with task runners
        run: |
          set -euo pipefail
          HOSTS="--set ingress.hostname=n8n.example.org --set mcp.hostname=mcp.example.org --set security.email=a@example.org"
          N8N_TAG=$(sed -n 's/^    tag: "\(.*\)"$/\1/p' charts/n8n/values.yaml | head -1)
          helm template t charts/n8n $HOSTS > /tmp/runners.yaml
          grep -q "image: \"n8nio/runners:${N8N_TAG}\"" /tmp/runners.yaml
          grep -q 'N8N_RUNNERS_MODE' /tmp/runners.yaml
          grep -A1 'N8N_RUNNERS_BROKER_LISTEN_ADDRESS' /tmp/runners.yaml | grep -q '127.0.0.1'
          helm template t charts/n8n $HOSTS --show-only templates/configmap-runners.yaml \
            | node -e '
              const t = require("fs").readFileSync(0, "utf8");
              const body = t.slice(t.indexOf("{")).split("\n").map((l) => l.replace(/^    /, "")).join("\n");
              const types = JSON.parse(body)["task-runners"].map((r) => r["runner-type"]).sort().join(",");
              if (types !== "javascript,python") { console.error("runners :", types); process.exit(1); }
            '
          helm template t charts/n8n $HOSTS --set runners.enabled=false > /tmp/no-runners.yaml
          ! grep -q 'n8nio/runners\|N8N_RUNNERS_MODE\|RUNNERS_AUTH_TOKEN' /tmp/no-runners.yaml

  release:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.21.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Package charts
        run: |
          mkdir -p .pages
          for chart in charts/*/; do
            helm dependency update "$chart"
            helm package "$chart" -d .pages
          done

      # L'index publié est fusionné, pas remplacé : les versions déjà installées
      # restent téléchargeables.
      - name: Helm repository index
        run: |
          git fetch origin gh-pages || true
          if git show origin/gh-pages:index.yaml > .pages/index-old.yaml 2>/dev/null; then
            helm repo index .pages --url https://nic01asfr.github.io/n8n-onyxia --merge .pages/index-old.yaml
            rm .pages/index-old.yaml
          else
            helm repo index .pages --url https://nic01asfr.github.io/n8n-onyxia
          fi

      - name: Install script
        run: install -m 0755 scripts/install.sh .pages/install.sh

      # Vitrine générée à côté de index.yaml : même site, mêmes URL qu'avant.
      - name: Vitrine
        run: SITE_OUT=.pages node site/generate.mjs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .pages
          publish_branch: gh-pages
          # Conserve les paquets, l'index et les fichiers des versions précédentes.
          keep_files: true
          commit_message: "chore: publish charts and site (${{ github.sha }})"
