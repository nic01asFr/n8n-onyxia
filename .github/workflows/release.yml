name: Test and release

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'charts/**'
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dependencies
        run: helm dependency update charts/n8n

      - name: Lint
        run: helm lint charts/n8n --set ingress.hostname=n8n.example.org --set mcp.hostname=mcp.example.org

      # helm lint ne voit pas les branches conditionnelles : chaque cas est rendu.
      - name: Render every configuration
        run: |
          set -euo pipefail
          HOSTS="--set ingress.hostname=n8n.example.org --set mcp.hostname=mcp.example.org --set security.email=a@example.org"
          render() { echo "::group::$1"; shift; helm template t charts/n8n $HOSTS "$@" > /tmp/out.yaml; echo "::endgroup::"; }

          # Mot de passe Onyxia (base 36 minuscule) : préfixé pour n8n, et
          # affiché dans les notes au format que lit le bouton de copie.
          helm install t charts/n8n $HOSTS --set security.password=abcdefghij0123456789 --dry-run=client > /tmp/notes.txt
          grep -q 'password: N8n-abcdefghij0123456789' /tmp/notes.txt

          render "mot de passe tiré au sort"
          render "postgres externe" --set database.type=postgresdb --set database.postgres.host=pg --set database.postgres.password=x
          render "sans MCP" --set mcp.enabled=false
          render "mise en veille" --set global.suspend=true
          grep -q 'replicas: 0' /tmp/out.yaml
          ! grep -q 'kind: Ingress' /tmp/out.yaml

          # Un Ingress sans hôte capterait tout le trafic non attribué : refusé.
          if helm template t charts/n8n > /dev/null 2>&1; then
            echo "le rendu sans hôte aurait dû échouer"; exit 1
          fi

      - name: install.sh
        run: bash -n scripts/install.sh

      - name: Vitrine
        run: node --test site/generate.test.mjs

  release:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Package charts
        run: |
          mkdir -p .pages
          for chart in charts/*/; do
            helm dependency update "$chart"
            helm package "$chart" -d .pages
          done

      # L'index publié est fusionné, pas remplacé : les versions déjà installées
      # restent téléchargeables.
      - name: Helm repository index
        run: |
          git fetch origin gh-pages || true
          if git show origin/gh-pages:index.yaml > .pages/index-old.yaml 2>/dev/null; then
            helm repo index .pages --url https://nic01asfr.github.io/n8n-onyxia --merge .pages/index-old.yaml
            rm .pages/index-old.yaml
          else
            helm repo index .pages --url https://nic01asfr.github.io/n8n-onyxia
          fi

      - name: Install script
        run: install -m 0755 scripts/install.sh .pages/install.sh

      # Vitrine générée à côté de index.yaml : même site, mêmes URL qu'avant.
      - name: Vitrine
        run: SITE_OUT=.pages node site/generate.mjs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .pages
          publish_branch: gh-pages
          # Conserve les paquets, l'index et les fichiers des versions précédentes.
          keep_files: true
          commit_message: "chore: publish charts and site (${{ github.sha }})"
